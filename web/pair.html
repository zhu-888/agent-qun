<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>配对这台设备 · AgentQun</title>
<link rel="stylesheet" href="/app.css">
<script>
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
</script>
<style>
  body { display: grid; place-items: center; min-height: 100dvh; height: auto; padding: 24px; background: var(--deep); }
  .pair { width: 100%; max-width: 340px; padding: 24px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow-panel); }
  .pair h1 { margin: 0 0 8px; font-size: 18px; font-weight: 500; }
  .pair p { margin: 0 0 20px; color: var(--fg-2); font-size: 14px; line-height: 22px; }
  .pair input { display: block; width: 100%; height: 56px; margin-bottom: 12px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg); color: var(--fg); font: 500 26px/1 var(--mono); letter-spacing: .3em; text-align: center; }
  .pair input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .pair button { width: 100%; height: 44px; justify-content: center; font-size: 15px; }
  .pair .err { min-height: 20px; margin: 12px 0 0; color: var(--bad-text, var(--bad)); font-size: 13px; }
</style>
</head>
<body>
<form class="pair" id="f">
  <h1>配对这台设备</h1>
  <p>在电脑的工作台里点左上角“工作台 → 手机访问”，生成一个 6 位配对码，填在这里。配对一次以后就不用再输。</p>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" aria-label="6 位配对码" required>
  <button class="btn prominent" id="go">配对</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  const code = document.getElementById('code'), err = document.getElementById('err'), go = document.getElementById('go');
  const ua = navigator.userAgent;
  const name = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? '安卓手机' : /Macintosh/.test(ua) ? 'Mac' : '手机';
  code.focus();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = ''; go.disabled = true;
    try {
      const r = await fetch('/api/pair', { method: 'POST', headers: { 'X-Workgroup': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code.value, name }) });
      if (r.ok) { location.replace('/'); return; }
      err.textContent = (await r.json().catch(() => ({}))).error || '配对失败';
      code.value = ''; code.focus();
    } catch { err.textContent = '连不上工作台，确认电脑开着、Tailscale 连着'; }
    go.disabled = false;
  });
</script>
</body>
</html>
